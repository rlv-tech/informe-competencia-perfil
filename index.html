<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Editorial Perfil | Informe de competencia</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <main class="radar">

    <header class="hero-header">
      <div class="hero-text">
        <div class="hero-kicker">EDITORIAL PERFIL</div>

        <h1>Informe de competencia</h1>

        <div id="analysisDate" class="hero-date">
          Cargando fecha...
        </div>
      </div>

      <div class="hero-brand">
        <img
          class="perfil-logo"
          src="./Sin.png"
          alt="Editorial Perfil"
        >
      </div>
    </header>


    <div id="loading" class="status loading">
      Cargando datos...
    </div>


    <div id="error" class="status error hidden">
      <strong>No se pudieron cargar los datos.</strong>

      <span>
        Verificá que <strong>data.json</strong> exista en el repositorio.
      </span>
    </div>


    <div id="content" class="hidden">

      <!-- PRIORIDADES -->

      <section class="section priorities-section">

        <div class="section-heading">
          <span class="section-kicker">FOCO EDITORIAL</span>

          <h2>Prioridades del día</h2>
        </div>

        <div id="priorities" class="priority-grid"></div>

      </section>


      <!-- MONITOREO -->

      <section
        id="monitoringSection"
        class="section monitoring-section"
      >

        <div class="section-heading">
          <span class="section-kicker">
            OPORTUNIDADES EDITORIALES
          </span>

          <h2>Monitoreo</h2>
        </div>


        <!-- CATEGORÍAS -->

        <div class="category-tabs">

          <button
            type="button"
            class="category-tab active"
            data-category="hipercompetencia"
          >
            Hipercompetencia
          </button>

          <button
            type="button"
            class="category-tab"
            data-category="perfil_pierde"
          >
            Perfil pierde
          </button>

          <button
            type="button"
            class="category-tab"
            data-category="sin_cobertura_perfil"
          >
            Sin cobertura
          </button>

          <button
            type="button"
            class="category-tab"
            data-category="oportunidades"
          >
            Oportunidades
          </button>

        </div>


        <!-- CONTROLES -->

        <div class="monitor-controls">

          <div class="results-label">

            <strong id="categoryTitle">
              Hipercompetencia
            </strong>

            <span id="categoryDescription"></span>

          </div>


          <div class="control-group">

            <label for="sortSelect">
              Ordenar

              <select id="sortSelect">

                <option value="brecha">
                  Mayor brecha
                </option>

                <option value="notas">
                  Más notas
                </option>

                <option value="medios">
                  Más medios
                </option>

                <option value="az">
                  A-Z
                </option>

              </select>
            </label>

          </div>

        </div>


        <!-- TEMAS -->

        <div
          id="themeGrid"
          class="theme-grid"
        ></div>


        <!-- SIN RESULTADOS -->

        <div
          id="emptyState"
          class="empty-state hidden"
        >
          No hay temas para esta categoría.
        </div>

      </section>

    </div>

  </main>


  <script src="./app.js"></script>

</body>
</html>
