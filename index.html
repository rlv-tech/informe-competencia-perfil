<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Editorial Perfil | Informe competencia</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <main class="radar">

    <!-- HEADER -->
    <header class="hero-header">

      <div class="hero-content">

        <div class="hero-text">

          <div class="hero-kicker">
            EDITORIAL PERFIL
          </div>

          <h1>
            Informe competencia
          </h1>

          <div id="analysisDate" class="hero-date">
            Cargando fecha...
          </div>

        </div>

        <div class="hero-brand">

          <img
            class="perfil-logo"
            src="./Sin.png"
            alt="Editorial Perfil"
          >

        </div>

      </div>

    </header>


    <!-- ESTADO DE CARGA -->
    <div id="loading" class="status loading">
      Cargando datos...
    </div>


    <!-- ERROR -->
    <div id="error" class="status error hidden">

      <strong>
        No se pudieron cargar los datos.
      </strong>

      <span>
        Verificá que <strong>data.json</strong> exista en el repositorio.
      </span>

    </div>


    <!-- CONTENIDO -->
    <div id="content" class="hidden">


      <!-- PRIORIDADES -->
      <section class="section priorities-section">

        <div class="section-heading">

          <div>

            <span class="section-kicker">
              FOCO EDITORIAL
            </span>

            <h2>
              Prioridades del día
            </h2>

          </div>

        </div>

        <div id="priorities" class="priority-grid"></div>

      </section>



      <!-- MONITOREO -->
      <section
        id="monitoringSection"
        class="section monitoring-section"
      >

        <div class="section-heading">

          <div>

            <span class="section-kicker">
              OPORTUNIDADES EDITORIALES
            </span>

            <h2>
              Monitoreo
            </h2>

          </div>

        </div>


        <!-- CATEGORÍAS -->
        <div
          class="category-tabs"
          role="tablist"
        >

          <button
            class="category-tab active"
            data-category="hipercompetencia"
            type="button"
          >
            Hipercompetencia
          </button>

          <button
            class="category-tab"
            data-category="perfil_pierde"
            type="button"
          >
            Perfil pierde
          </button>

          <button
            class="category-tab"
            data-category="sin_cobertura_perfil"
            type="button"
          >
            Sin cobertura
          </button>

          <button
            class="category-tab"
            data-category="oportunidades"
            type="button"
          >
            Oportunidades
          </button>

        </div>


        <!-- CONTROLES -->
        <div class="monitor-controls">

          <div class="results-label">

            <strong id="categoryTitle">
              Hipercompetencia
            </strong>

            <span id="categoryDescription"></span>

          </div>


          <div class="control-group">

            <label for="sortSelect">

              Ordenar

              <select id="sortSelect">

                <option value="brecha">
                  Mayor brecha
                </option>

                <option value="notas">
                  Más notas
                </option>

                <option value="medios">
                  Más medios
                </option>

                <option value="az">
                  A-Z
                </option>

              </select>

            </label>

          </div>

        </div>


        <!-- CARDS -->
        <div
          id="themeGrid"
          class="theme-grid"
        ></div>


        <!-- SIN RESULTADOS -->
        <div
          id="emptyState"
          class="empty-state hidden"
        >
          No hay temas para esta categoría.
        </div>

      </section>

    </div>

  </main>


  <script src="./app.js"></script>

</body>
</html>
